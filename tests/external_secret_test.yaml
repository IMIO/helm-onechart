suite: test externalSecret
templates:
  - externalSecret.yaml
tests:
  - it: Should not create ExternalSecret when externalSecrets is empty
    set:
      externalSecrets: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: Should create ExternalSecret with minimal configuration
    set:
      externalSecrets:
        - target:
            template:
              data:
                MY_SECRET: "{{ .Values.secret }}"
          data:
            - secretKey: secret
              remoteRef:
                key: my-vault-path
                property: password
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-0
      - equal:
          path: spec.refreshInterval
          value: "1h"
      - equal:
          path: spec.secretStoreRef.name
          value: vault-backend
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore
      - equal:
          path: spec.target.creationPolicy
          value: Owner
      - equal:
          path: spec.target.template.type
          value: Opaque
      - equal:
          path: spec.target.template.engineVersion
          value: v2

  - it: Should create ExternalSecret with custom name
    set:
      externalSecrets:
        - name: my-custom-secret
          target:
            template:
              data:
                DB_PASSWORD: "{{ .Values.dbPassword }}"
          data:
            - secretKey: dbPassword
              remoteRef:
                key: database/credentials
                property: password
    asserts:
      - equal:
          path: metadata.name
          value: my-custom-secret

  - it: Should create ExternalSecret with templated name
    set:
      externalSecrets:
        - name: "{{ .Release.Name }}-db-secret"
          target:
            template:
              data:
                SECRET: "{{ .Values.secret }}"
          data:
            - secretKey: secret
              remoteRef:
                key: path
                property: prop
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-db-secret

  - it: Should use custom refreshInterval
    set:
      externalSecrets:
        - refreshInterval: 30m
          target:
            template:
              data:
                SECRET: "value"
          data:
            - secretKey: key
              remoteRef:
                key: path
                property: prop
    asserts:
      - equal:
          path: spec.refreshInterval
          value: "30m"

  - it: Should use custom secretStore name
    set:
      externalSecrets:
        - secretStore:
            name: my-vault-store
          target:
            template:
              data:
                SECRET: "value"
          data:
            - secretKey: key
              remoteRef:
                key: path
                property: prop
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: my-vault-store

  - it: Should use custom secretStore kind
    set:
      externalSecrets:
        - secretStore:
            name: cluster-vault
            kind: ClusterSecretStore
          target:
            template:
              data:
                SECRET: "value"
          data:
            - secretKey: key
              remoteRef:
                key: path
                property: prop
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: cluster-vault
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore

  - it: Should use custom target name
    set:
      externalSecrets:
        - target:
            name: my-target-secret
            template:
              data:
                SECRET: "value"
          data:
            - secretKey: key
              remoteRef:
                key: path
                property: prop
    asserts:
      - equal:
          path: spec.target.name
          value: my-target-secret

  - it: Should use custom creationPolicy
    set:
      externalSecrets:
        - target:
            creationPolicy: Orphan
            template:
              data:
                SECRET: "value"
          data:
            - secretKey: key
              remoteRef:
                key: path
                property: prop
    asserts:
      - equal:
          path: spec.target.creationPolicy
          value: Orphan

  - it: Should use custom template type
    set:
      externalSecrets:
        - target:
            template:
              type: kubernetes.io/tls
              data:
                tls.crt: "{{ .Values.cert }}"
                tls.key: "{{ .Values.key }}"
          data:
            - secretKey: cert
              remoteRef:
                key: certificates/myapp
                property: certificate
            - secretKey: key
              remoteRef:
                key: certificates/myapp
                property: private_key
    asserts:
      - equal:
          path: spec.target.template.type
          value: kubernetes.io/tls

  - it: Should create multiple data entries
    set:
      externalSecrets:
        - target:
            template:
              data:
                DB_CONNECTION: "{{ .Values.dbUser }}:{{ .Values.dbPass }}@{{ .Values.dbHost }}"
          data:
            - secretKey: dbUser
              remoteRef:
                key: database/credentials
                property: username
            - secretKey: dbPass
              remoteRef:
                key: database/credentials
                property: password
            - secretKey: dbHost
              remoteRef:
                key: database/config
                property: host
    asserts:
      - lengthEqual:
          path: spec.data
          count: 3
      - contains:
          path: spec.data
          content:
            secretKey: dbUser
            remoteRef:
              key: database/credentials
              property: username
      - contains:
          path: spec.data
          content:
            secretKey: dbPass
            remoteRef:
              key: database/credentials
              property: password
      - contains:
          path: spec.data
          content:
            secretKey: dbHost
            remoteRef:
              key: database/config
              property: host

  - it: Should create multiple ExternalSecrets
    set:
      externalSecrets:
        - name: first-secret
          target:
            template:
              data:
                SECRET1: "{{ .Values.s1 }}"
          data:
            - secretKey: s1
              remoteRef:
                key: path1
                property: prop1
        - name: second-secret
          target:
            template:
              data:
                SECRET2: "{{ .Values.s2 }}"
          data:
            - secretKey: s2
              remoteRef:
                key: path2
                property: prop2
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: first-secret
      - documentIndex: 1
        equal:
          path: metadata.name
          value: second-secret

  - it: Should include standard labels
    set:
      externalSecrets:
        - target:
            template:
              data:
                SECRET: "value"
          data:
            - secretKey: key
              remoteRef:
                key: path
                property: prop
    asserts:
      - isNotEmpty:
          path: metadata.labels

  - it: Should use correct namespace
    release:
      namespace: my-namespace
    set:
      externalSecrets:
        - target:
            template:
              data:
                SECRET: "value"
          data:
            - secretKey: key
              remoteRef:
                key: path
                property: prop
    asserts:
      - equal:
          path: metadata.namespace
          value: my-namespace

  - it: Should create ExternalSecret with multiple template data entries
    set:
      externalSecrets:
        - target:
            template:
              data:
                config.yaml: |
                  database:
                    host: {{ .Values.dbHost }}
                    port: {{ .Values.dbPort }}
                credentials.json: |
                  {"user": "{{ .Values.user }}", "pass": "{{ .Values.pass }}"}
          data:
            - secretKey: dbHost
              remoteRef:
                key: db/config
                property: host
            - secretKey: dbPort
              remoteRef:
                key: db/config
                property: port
            - secretKey: user
              remoteRef:
                key: db/creds
                property: username
            - secretKey: pass
              remoteRef:
                key: db/creds
                property: password
    asserts:
      - isNotEmpty:
          path: spec.target.template.data["config.yaml"]
      - isNotEmpty:
          path: spec.target.template.data["credentials.json"]

  - it: Should create ExternalSecret with dockerconfigjson type
    set:
      externalSecrets:
        - target:
            name: docker-registry-secret
            template:
              type: kubernetes.io/dockerconfigjson
              data:
                .dockerconfigjson: |
                  {"auths":{"registry.example.com":{"auth":"{{ .Values.dockerAuth }}"}}}
          data:
            - secretKey: dockerAuth
              remoteRef:
                key: docker/registry
                property: auth
    asserts:
      - equal:
          path: spec.target.template.type
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: spec.target.name
          value: docker-registry-secret

  - it: Should work with full configuration
    release:
      name: myapp
      namespace: production
    set:
      externalSecrets:
        - name: "{{ .Release.Name }}-full-secret"
          refreshInterval: 15m
          secretStore:
            name: vault-cluster-store
            kind: ClusterSecretStore
          target:
            name: myapp-secrets
            creationPolicy: Merge
            template:
              type: Opaque
              data:
                DATABASE_URL: "postgresql://{{ .Values.dbUser }}:{{ .Values.dbPass }}@{{ .Values.dbHost }}:5432/{{ .Values.dbName }}"
                API_KEY: "{{ .Values.apiKey }}"
          data:
            - secretKey: dbUser
              remoteRef:
                key: apps/myapp/database
                property: username
            - secretKey: dbPass
              remoteRef:
                key: apps/myapp/database
                property: password
            - secretKey: dbHost
              remoteRef:
                key: apps/myapp/database
                property: host
            - secretKey: dbName
              remoteRef:
                key: apps/myapp/database
                property: name
            - secretKey: apiKey
              remoteRef:
                key: apps/myapp/api
                property: key
    asserts:
      - equal:
          path: metadata.name
          value: myapp-full-secret
      - equal:
          path: metadata.namespace
          value: production
      - equal:
          path: spec.refreshInterval
          value: "15m"
      - equal:
          path: spec.secretStoreRef.name
          value: vault-cluster-store
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.target.name
          value: myapp-secrets
      - equal:
          path: spec.target.creationPolicy
          value: Merge
      - lengthEqual:
          path: spec.data
          count: 5
