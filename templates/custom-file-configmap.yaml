{{- range .Values.volumes }}
  {{- if .fileName }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "robustName" (printf "%s-%s" $.Release.Name .name) }}
  namespace: {{ $.Release.Namespace }}
data:
  {{ .fileName }}: |
    {{- tpl .fileContent $ | nindent 4 }}

  {{- end }}
{{- end }}
